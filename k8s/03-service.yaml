# ClusterIP on purpose — MLflow isn't meant to be public. Reach it via
# `kubectl port-forward` for now (see README); a LoadBalancer/Ingress with
# auth in front is a deliberate later step, not a default.
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
  annotations:
    # Links this Service to the BackendConfig that enables IAP
    cloud.google.com/backend-config: '{"default": "mlflow-backend-config"}'
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
