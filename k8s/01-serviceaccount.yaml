# This KSA is what makes Workload Identity work. The annotation tells GKE
# "when a pod using this KSA calls a Google API, exchange its identity for
# the Google service account below" — no key file involved.
#
# GSA_EMAIL_PLACEHOLDER: replace with the value of the
# `mlflow_workload_gsa_email` Terraform output, e.g.:
#   mlflow-workload@your-project-id.iam.gserviceaccount.com
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: mlflow
  annotations:
    iam.gke.io/gcp-service-account: mlflow-workload@project-778a4715-afd6-4c3d-aa4.iam.gserviceaccount.com
