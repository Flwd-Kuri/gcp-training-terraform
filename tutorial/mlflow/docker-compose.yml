services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    ports:
      - "5001:5001"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5001
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts

  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/tutorial
    environment:
      # Points the notebook at the mlflow service on the compose network
      MLFLOW_TRACKING_URI: http://mlflow:5001
    depends_on:
      - mlflow

volumes:
  mlflow-data:
