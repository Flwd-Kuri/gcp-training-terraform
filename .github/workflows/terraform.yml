name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ["**.tf", "**.tfvars"]
  push:
    branches: [main]
    paths: ["**.tf", "**.tfvars"]
  workflow_dispatch:  # manual trigger for the destroy job

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation
  pull-requests: write

# Only one Terraform operation at a time — prevents concurrent state locks.
# cancel-in-progress: false queues instead of cancelling (safe for apply/destroy).
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.7.5"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
        continue-on-error: false

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production   # add a required-reviewer rule on this env in repo settings
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false

  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state"

      # compute.securityAdmin is required to delete firewall rules but is not
      # included in compute.networkAdmin. Grant it here so destroy can proceed
      # without requiring a manual one-time bootstrap step.
      - name: Ensure compute.securityAdmin on terraform-runner
        run: |
          gcloud projects add-iam-policy-binding ${{ secrets.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --role="roles/compute.securityAdmin"

      # google_service_networking_connection: cannot be deleted while Cloud
      # SQL's internal cleanup is still in progress. Remove from state and
      # delete via gcloud to avoid blocking the rest of the destroy.
      # google_iap_brand: immutable GCP resource, can never be deleted.
      # Remove from state so Terraform does not attempt (and fail) to delete it.
      - name: Remove undeletable resources from state
        run: |
          terraform state rm google_service_networking_connection.private_vpc_connection || true
          terraform state rm google_iap_brand.mlflow || true
          gcloud services vpc-peerings delete \
            --service=servicenetworking.googleapis.com \
            --network=mlops-vpc \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --force --quiet || true

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve -input=false
